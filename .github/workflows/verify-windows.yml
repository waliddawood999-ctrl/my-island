name: Verify Windows fixes

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Rust tests and native debug build
        working-directory: src-tauri
        run: |
          cargo test --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo build --locked
      - name: Install browser test runner (no dependency changes)
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install chromium
      - name: Serve built frontend for native debug build
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force docs/screenshots, test-results | Out-Null
          Start-Process -FilePath 'node' -ArgumentList 'node_modules/vite/bin/vite.js preview --host localhost --port 1420 --strictPort' -RedirectStandardOutput 'test-results/vite.log' -RedirectStandardError 'test-results/vite-error.log'
          for ($i = 0; $i -lt 30; $i++) {
            try { $r = Invoke-WebRequest 'http://localhost:1420' -TimeoutSec 2; if ($r.StatusCode -eq 200) { exit 0 } } catch {}
            Start-Sleep -Seconds 1
          }
          throw 'Vite did not start'
      - name: Configure WebView2 debugging only on the disposable test runner
        shell: pwsh
        run: |
          # Elevated Windows runners ignore WEBVIEW2_* flags. Scope the documented HKLM override to this app only.
          $root = 'HKLM:\SOFTWARE\Policies\Microsoft\Edge\WebView2'
          foreach ($key in @('AdditionalBrowserArguments', 'UserDataFolder')) {
            New-Item -Path "$root\$key" -Force | Out-Null
          }
          foreach ($app in @('my-island.exe', 'app.myisland.desktop')) {
            New-ItemProperty -Path "$root\AdditionalBrowserArguments" -Name $app -Value '--remote-debugging-port=9222' -PropertyType String -Force | Out-Null
            New-ItemProperty -Path "$root\UserDataFolder" -Name $app -Value "$env:RUNNER_TEMP\myisland-webview2" -PropertyType String -Force | Out-Null
          }
      - name: Native WebView2 IPC, settings persistence and quit
        run: node scripts/native.regression.cjs
      - name: Browser UI regressions (mock bridge)
        env:
          BASE: http://localhost:1420
        run: npm run test:ui
      - name: Remove test-only WebView2 policy
        if: always()
        shell: pwsh
        run: |
          $root = 'HKLM:\SOFTWARE\Policies\Microsoft\Edge\WebView2'
          foreach ($key in @('AdditionalBrowserArguments', 'UserDataFolder')) {
            foreach ($app in @('my-island.exe', 'app.myisland.desktop')) {
              Remove-ItemProperty -Path "$root\$key" -Name $app -ErrorAction SilentlyContinue
            }
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-verification-${{ github.run_id }}
          path: |
            test-results/
            docs/screenshots/
          retention-days: 14
