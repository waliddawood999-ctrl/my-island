name: Build Windows

on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish this build to the auto-updater (my-island-releases)'
        type: boolean
        default: false
  # The owner explicitly authorised publication of settings PR #18.
  # Other pushes remain build-only; manual main+publish remains supported.
  pull_request:
    types: [closed]
    branches: [main]
  push:
    branches: [main, fix/settings-review-2026-11-03]
    paths-ignore: ["docs/**"]

permissions:
  contents: read

jobs:
  build:
    # This exact infrastructure-only preparation commit reuses the already running app validation.
    if: >-
      github.event_name != 'pull_request' && github.event.head_commit.message != 'ci: publish verified settings artifact'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - run: npm ci

      - name: Frontend tests
        run: npm test

      # tauri::generate_context! يضمّن frontendDist (../dist) وقت الترجمة ويفشل إن غاب؛ لذا نبني الواجهة قبل cargo test.
      - name: Typecheck & build frontend
        run: npm run build

      - name: Settings interaction regression
        timeout-minutes: 6
        shell: pwsh
        run: |
          $tools = Join-Path $env:RUNNER_TEMP 'settings-test-tools'
          npm install --prefix $tools --no-save --package-lock=false playwright@1.56.1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:NODE_PATH = Join-Path $tools 'node_modules'
          $browsers = @("$env:ProgramFiles/Google/Chrome/Application/chrome.exe", "${env:ProgramFiles(x86)}/Google/Chrome/Application/chrome.exe", "${env:ProgramFiles(x86)}/Microsoft/Edge/Application/msedge.exe", "$env:ProgramFiles/Microsoft/Edge/Application/msedge.exe")
          $env:SETTINGS_BROWSER_EXECUTABLE = $browsers | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $env:SETTINGS_BROWSER_EXECUTABLE) { throw 'No installed Chrome or Edge available for settings acceptance' }
          Write-Host "Using installed browser: $env:SETTINGS_BROWSER_EXECUTABLE"
          $server = Start-Process node -ArgumentList 'node_modules/vite/bin/vite.js preview --host 127.0.0.1 --port 4173' -PassThru
          try { node scripts/settings-update.regression.cjs; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE } } finally { Stop-Process -Id $server.Id -ErrorAction SilentlyContinue }

      - name: Settings screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: settings-review-screenshots
          path: docs/screenshots/settings-update-*.png
          if-no-files-found: ignore

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test --locked

      # ختم الإصدار آليًا 1.0.<رقم التشغيل> في tauri.conf.json قبل البناء (يقرؤه المحدّث للمقارنة).
      - name: Stamp version
        shell: bash
        run: |
          VERSION="1.0.${{ github.run_number }}"
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"
          node -e "const fs=require('fs');const p='src-tauri/tauri.conf.json';const c=JSON.parse(fs.readFileSync(p,'utf8'));c.version=process.env.V;fs.writeFileSync(p,JSON.stringify(c,null,2)+'\n')"
        env:
          V: 1.0.${{ github.run_number }}

      # سرّ التوقيع اختياري: غيابه لا يُفشل البناء (لكن لن يُنتَج .sig ولا إصدار تحديث).
      - name: Build
        shell: bash
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "TAURI_SIGNING_PRIVATE_KEY غير مضبوط: بناء بلا توقيع تحديث."
            # بلا مفتاح لا يمكن توليد ملفات المحدّث؛ نعطّلها لهذا التشغيل كي لا يفشل البناء.
            node -e "const fs=require('fs');const p='src-tauri/tauri.conf.json';const c=JSON.parse(fs.readFileSync(p,'utf8'));c.bundle.createUpdaterArtifacts=false;fs.writeFileSync(p,JSON.stringify(c,null,2)+'\n')"
          fi
          npm run tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - uses: actions/upload-artifact@v4
        with:
          name: my-island-windows-installer
          path: src-tauri/target/release/bundle/**
          if-no-files-found: error

      # نشر التحديث: يعمل فقط حين يوجد السرّان TAURI_SIGNING_PRIVATE_KEY وRELEASES_TOKEN.
      # الشرط عبر خطوة تفحص الأسرار (لا يمكن استعمال secrets مباشرة في if).
      # النشر من هذا العمل: تشغيل يدوي main+publish؛ طلب #18 ينشر المثبّت المتحقق منه في العمل المنفصل أدناه.
      # النشر يستخدم RELEASES_TOKEN لمستودع آخر، فلا يحتاج GITHUB_TOKEN صلاحية كتابة.
      - name: Check release secrets
        id: rel
        shell: bash
        run: |
          if [ "$EVENT" != "workflow_dispatch" ] && [ "$EVENT" != "pull_request" ]; then echo "Build only; publication is gated separately."; fi
          if [ -n "$K" ] && [ -n "$T" ]; then echo "go=true" >> "$GITHUB_OUTPUT"; else echo "go=false" >> "$GITHUB_OUTPUT"; echo "نشر التحديث متخطّى: السرّان غير مكتملين."; fi
        env:
          K: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          T: ${{ secrets.RELEASES_TOKEN }}
          EVENT: ${{ github.event_name }}
          PUBLISH: ${{ inputs.publish }}
          REF: ${{ github.ref }}

      - name: Publish update release
        if: steps.rel.outputs.go == 'true' && github.event_name == 'workflow_dispatch' && inputs.publish == true && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          V: ${{ env.APP_VERSION }}
        run: |
          set -euo pipefail
          VERSION="$APP_VERSION"
          DIR="src-tauri/target/release/bundle/nsis"
          EXE=$(ls "$DIR"/*-setup.exe | head -n1)
          SIG="$EXE.sig"
          test -f "$SIG"
          NAME=$(basename "$EXE")
          REPO="waliddawood999-ctrl/my-island-releases"
          URL="https://github.com/$REPO/releases/download/v$VERSION/$NAME"
          export SIG URL
          node -e "const fs=require('fs');const j={version:process.env.V,notes:'MyIsland '+process.env.V,pub_date:new Date().toISOString(),platforms:{'windows-x86_64':{signature:fs.readFileSync(process.env.SIG,'utf8').trim(),url:process.env.URL}}};fs.writeFileSync('latest.json',JSON.stringify(j,null,2))"
          gh release create "v$VERSION" "$EXE" "$SIG" latest.json --repo "$REPO" --title "v$VERSION" --notes "MyIsland $VERSION"


  publish-verified-settings:
    # One publication explicitly authorised by the owner; no other PR can publish.
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 18 && github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'main' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Verify successful source run and identical application blobs
        env:
          GH_TOKEN: ${{ github.token }}
          MERGED_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$REPO/actions/runs/41561196923" > source-run.json
          gh api "repos/$REPO/git/trees/e90bde834f53634d3718d9a43c3c3f3f983a1d28?recursive=1" > source-tree.json
          gh api "repos/$REPO/git/trees/$MERGED_SHA?recursive=1" > merged-tree.json
          node <<'NODE'
          const fs = require('fs');
          const run = JSON.parse(fs.readFileSync('source-run.json'));
          if (run.id !== 41561196923 || run.status !== 'completed' || run.conclusion !== 'success' || run.head_sha !== 'e90bde834f53634d3718d9a43c3c3f3f983a1d28' || run.head_repository.full_name !== process.env.REPO || run.run_number !== 81) throw Error('Source installer run is not the verified settings build');
          const ignored = new Set(['.github/workflows/build-windows.yml', 'docs/STATUS.md']);
          function blobs(file) {
            const tree = JSON.parse(fs.readFileSync(file));
            if (tree.truncated || !Array.isArray(tree.tree)) throw Error('Incomplete source tree');
            return Object.fromEntries(tree.tree.filter(x => x.type === 'blob' && !ignored.has(x.path)).sort((a,b) => a.path.localeCompare(b.path)).map(x => [x.path,x.sha]));
          }
          if (JSON.stringify(blobs('source-tree.json')) !== JSON.stringify(blobs('merged-tree.json'))) throw Error('Merged application differs from the tested installer source');
          console.log('Verified: successful Windows run, exact application tree, fixed version 1.0.81');
          NODE

      - uses: actions/download-artifact@v4
        with:
          name: my-island-windows-installer
          run-id: 41561196923
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          path: verified-installer

      - name: Publish the verified signed settings installer
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          EXE=$(find verified-installer -type f -name 'MyIsland_1.0.81_x64-setup.exe')
          test -f "$EXE"
          SIG="$EXE.sig"
          test -s "$SIG"
          export EXE SIG
          node <<'NODE'
          const fs = require('fs');
          const name = require('path').basename(process.env.EXE);
          const manifest = {version:'1.0.81',notes:'Settings reliability, import validation and simpler controls',pub_date:new Date().toISOString(),platforms:{'windows-x86_64':{signature:fs.readFileSync(process.env.SIG,'utf8').trim(),url:'https://github.com/waliddawood999-ctrl/my-island-releases/releases/download/v1.0.81/'+name}}};
          fs.writeFileSync('latest.json',JSON.stringify(manifest,null,2));
          NODE
          gh release create v1.0.81 "$EXE" "$SIG" latest.json --repo waliddawood999-ctrl/my-island-releases --title 'v1.0.81 — Settings update' --notes 'Settings save acknowledgements and retries, validated imports/exports, simpler sections, theme previews, safe section resets and appearance read permissions. Rollback: v1.0.73 and backup/pre-settings-update-2026-11-03.'
