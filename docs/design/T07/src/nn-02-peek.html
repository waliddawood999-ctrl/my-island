<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><link rel="stylesheet" href="base.css"><script src="icons.js"></script><style>
body{--w:1000px;--h:360px}
.peek{width:400px;height:120px;--r:26px;--ear:12px;padding:14px 20px 8px;display:flex;flex-direction:column;justify-content:space-between}
.m{display:flex;gap:14px;align-items:center}
.art{width:64px;height:64px;border-radius:16px;background:linear-gradient(135deg,#f0556d,#f7b733);box-shadow:0 10px 30px -6px #f0556dbb,0 0 0 1px rgba(255,255,255,.08);position:relative;overflow:hidden;flex:none}
.art::after{content:"";position:absolute;inset:14px;border-radius:50%;background:#181a2a;box-shadow:0 0 0 10px rgba(0,0,0,.35)}
.txt{min-width:0;flex:1}.t{font-size:14px;font-weight:700}.a{font-size:12px;color:var(--ink2);margin-top:2px}
.pr{height:3px;border-radius:3px;background:rgba(255,255,255,.16);margin-top:8px;direction:ltr}.pr i{display:block;height:100%;width:34%;border-radius:3px;background:var(--accent)}
.tm{display:flex;justify-content:space-between;direction:ltr;font-size:10.5px;color:var(--ink2);margin-top:3px;font-variant-numeric:tabular-nums}
.bars{display:flex;gap:3px;align-items:center;height:26px;direction:ltr}.bars i{width:4px;border-radius:4px;background:var(--accent)}
.src{display:inline-flex;gap:5px;align-items:center;background:rgba(255,255,255,.12);border-radius:999px;padding:2px 8px;font-size:10px;font-weight:700;margin-bottom:3px}.src i{width:6px;height:6px;border-radius:50%;background:#1ed760}
</style></head><body>
<div class="top notch peek"><div class="m"><div class="art"></div><div class="txt"><div class="src"><i></i>Spotify</div><div class="t">ليلة هادئة على الشاطئ</div><div class="a">نوفا · طريق الليل</div><div class="pr"><i></i></div><div class="tm"><span>1:04</span><span>-2:30</span></div></div>
<div class="bars"><i style="height:10px"></i><i style="height:22px"></i><i style="height:14px"></i><i style="height:26px"></i><i style="height:12px"></i></div></div>
<div class="dots"><i class="on"></i><i></i><i></i><i></i></div></div>
<div class="tag" style="top:150px;left:50%;transform:translateX(-50%)">عند المرور بعد 250ms — صبغة غلاف الأغنية تتوهّج حول الغلاف</div>
<div class="cap" style="bottom:22px"><b>اللمحة (Peek):</b> 400×120، أسود صلب، حافة علوية ملتصقة، زوايا سفلية 26px. عنوان 14/700، ثانوي 12 بعتامة 62٪، شريط تقدّم 3px بلون الغلاف. العجلة تبدّل البطاقات؛ النقر يفتح اللوحة.</div>
</body></html>
