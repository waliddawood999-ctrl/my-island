<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><link rel="stylesheet" href="base.css"><script src="icons.js"></script><style>
body{--w:1000px;--h:520px}
.panel{width:520px;height:290px;--r:34px;--ear:14px;padding:14px 16px;display:flex;flex-direction:column}
.empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center}
.art{width:64px;height:64px;border-radius:20px;border:2px dashed rgba(255,255,255,.3);display:grid;place-items:center;color:var(--ink2)}
.btn{display:inline-flex;gap:6px;align-items:center;padding:7px 14px;border-radius:999px;background:rgba(255,255,255,.12);font-size:12.5px;font-weight:700}
.btn.p{background:#fff;color:#000}
</style></head><body>
<div class="top notch panel"><div style="display:flex;justify-content:space-between"><script>document.write(tabsHTML(1))</script><div class="seg"><span class="on">الكل</span><span>تطبيقات</span><span>ملفات</span></div></div>
<div class="empty"><div class="art"><script>document.write(ic('bolt','width:28px;height:28px'))</script></div><div style="font-size:16px;font-weight:800">الوصول السريع فارغ</div><div style="font-size:12px;color:var(--ink2);max-width:300px;line-height:1.7">ثبّت تطبيقاتك المفضلة، أو اسحب إليه ملفات ومجلدات تحتاجها كثيرًا — فتبقى على بُعد نقرة.</div>
<div style="display:flex;gap:8px;margin-top:4px"><span class="btn p"><script>document.write(ic('plus'))</script>إضافة تطبيق</span><span class="btn"><script>document.write(ic('folder'))</script>إضافة ملف</span></div></div></div>
<div class="cap"><b>الحالة الفارغة:</b> رسالة قصيرة + زرّان. نفس الشاشة تظهر في اللمحة كبطاقة «الوصول السريع» مع تلميح «اسحب ملفًا إلى هنا».</div>
</body></html>
