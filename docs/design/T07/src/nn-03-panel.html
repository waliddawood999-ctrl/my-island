<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><link rel="stylesheet" href="base.css"><script src="icons.js"></script><style>
body{--w:1000px;--h:520px}
.panel{width:520px;height:290px;--r:32px;--ear:14px;padding:12px 18px 14px;display:flex;flex-direction:column;gap:6px}
.hd{display:flex;justify-content:space-between;align-items:center}
.m{flex:1;display:flex;align-items:center;gap:18px}
.art{width:112px;height:112px;border-radius:20px;background:linear-gradient(135deg,#f0556d,#f7b733);box-shadow:0 10px 30px -6px #f0556dbb,0 0 0 1px rgba(255,255,255,.08);position:relative;overflow:hidden;flex:none}
.art::after{content:"";position:absolute;inset:30px;border-radius:50%;background:#181a2a;box-shadow:0 0 0 14px rgba(0,0,0,.35)}
.tx{flex:1;min-width:0}.t{font-size:20px;font-weight:800;line-height:1.2}.a{font-size:13px;color:var(--ink2);margin-top:3px}
.pr{height:5px;border-radius:5px;background:rgba(255,255,255,.16);margin-top:12px;direction:ltr}.pr i{display:block;height:100%;width:34%;border-radius:5px;background:var(--accent)}
.tm{display:flex;justify-content:space-between;direction:ltr;font-size:10.5px;color:var(--ink2);margin-top:4px}
.ctl{display:flex;gap:14px;align-items:center;justify-content:center;direction:ltr;margin-top:10px}
.ctl .g{width:34px;height:34px;border-radius:50%;display:grid;place-items:center}.ctl .p{width:44px;height:44px;border-radius:50%;background:#fff;color:#000;display:grid;place-items:center}
.src{display:inline-flex;gap:5px;align-items:center;background:rgba(255,255,255,.12);border-radius:999px;padding:2px 8px;font-size:10px;font-weight:700}.src i{width:6px;height:6px;border-radius:50%;background:#1ed760}
</style></head><body>
<div class="top notch panel"><div class="hd"><script>document.write(tabsHTML(0))</script><i style="color:var(--ink2)"><script>document.write(ic('chip'))</script></i></div>
<div class="m"><div class="art"></div><div class="tx"><span class="src"><i></i>Spotify</span><div class="t" style="margin-top:6px">ليلة هادئة على الشاطئ</div><div class="a">نوفا · طريق الليل</div><div class="pr"><i></i></div><div class="tm"><span>1:04</span><span>-2:30</span></div>
<div class="ctl"><span class="g"><script>document.write(ic('skipb','fill:#fff;width:16px;height:16px'))</script></span><span class="p"><script>document.write(ic('pause','fill:#000;width:18px;height:18px'))</script></span><span class="g"><script>document.write(ic('skipf','fill:#fff;width:16px;height:16px'))</script></span></div></div></div></div>
<div class="tag" style="top:318px;left:50%;transform:translateX(-50%)">صف تبويبات أيقونات 30px (نمط NotchNook)</div>
<div class="cap"><b>اللوحة (Panel):</b> 520×290 بزوايا سفلية 32px — العجلة تقلّب الصفحات؛ الخلفية سوداء مصمتة (أو زجاج حسب الإعداد). الغلاف الكبير بتوهّج لونه من الصورة.</div>
</body></html>
